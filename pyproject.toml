[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-computer-autopilot"
version = "0.5.0"
description = "A local-first Windows AI Computer Autopilot — MCP server for safe computer control"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.26,<3",
    "pyautogui>=0.9.54",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "playwright>=1.40.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
clicko = "local_computer_autopilot.cli:main"
local-computer-autopilot = "local_computer_autopilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_computer_autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
